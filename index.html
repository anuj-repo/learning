<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Contents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .divider {
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            margin-bottom: 30px;
        }

        .toc-list {
            list-style: none;
        }

        .toc-list li {
            margin-bottom: 15px;
        }

        .toc-list a {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .toc-list a:hover {
            background: linear-gradient(90deg, #667eea15, #764ba215);
            border-left-color: #667eea;
            transform: translateX(10px);
        }

        .toc-number {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            margin-right: 15px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .toc-title {
            flex: 1;
        }

        .toc-arrow {
            color: #667eea;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toc-list a:hover .toc-arrow {
            opacity: 1;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Table of Contents</h1>
        <p class="subtitle">Navigate through the sections</p>
        <div class="divider"></div>
        
        <nav>
            <ul class="toc-list">
                <li>
                    <a href="#introduction">
                        <span class="toc-number">1</span>
                        <span class="toc-title">Introduction</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="#getting-started">
                        <span class="toc-number">2</span>
                        <span class="toc-title">Getting Started</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="#basics">
                        <span class="toc-number">3</span>
                        <span class="toc-title">Basics</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="#advanced-topics">
                        <span class="toc-number">4</span>
                        <span class="toc-title">Advanced Topics</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="#examples">
                        <span class="toc-number">5</span>
                        <span class="toc-title">Examples</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="#resources">
                        <span class="toc-number">6</span>
                        <span class="toc-title">Resources</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="#faq">
                        <span class="toc-number">7</span>
                        <span class="toc-title">FAQ</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="#contact">
                        <span class="toc-number">8</span>
                        <span class="toc-title">Contact</span>
                        <span class="toc-arrow">→</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <footer>
            <p>© 2026 Learning Hub. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
